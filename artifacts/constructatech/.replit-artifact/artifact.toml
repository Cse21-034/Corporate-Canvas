kind = "web"
previewPath = "/"
title = "Constructatech Ventures"
description = "Full-stack web platform for Constructatech Ventures — Botswana's IT infrastructure, networking & automation company. Includes a public marketing site (Home, About, Solutions, Industries, Contact), an authenticated client portal (Dashboard, Projects, Tickets, Invoices), and an admin panel. Built with premium corporate design using the brand's ink/coral/spectrum palette."
version = "1.0.0"
id = "artifacts/constructatech"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20918

[services.development]
run = "pnpm --filter @workspace/constructatech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/constructatech", "run", "build" ]
serve = "static"
publicDir = "artifacts/constructatech/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20918"
BASE_PATH = "/"
