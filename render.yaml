services:
  - type: web
    name: constructatech-api
    runtime: node
    region: oregon
    plan: free
    # --prod=false keeps devDependencies (esbuild, drizzle-kit, tsx) installed
    # even though NODE_ENV is production — the build needs all three.
    # `push` creates the schema; `seed` is idempotent and safe to re-run.
    buildCommand: "pnpm install --prod=false && pnpm --filter @workspace/db run push && pnpm --filter @workspace/db run seed && pnpm --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: constructatech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false   # set this manually to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: LOG_LEVEL
        value: info

databases:
  - name: constructatech-db
    databaseName: constructatech
    user: constructatech
    region: oregon
    plan: free
