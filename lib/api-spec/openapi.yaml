openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Constructatech Ventures API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: IT services offered
  - name: industries
    description: Industries served
  - name: quotes
    description: Quote requests
  - name: newsletter
    description: Newsletter subscriptions
  - name: auth
    description: Authentication
  - name: portal
    description: Client portal
  - name: admin
    description: Staff admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{slug}:
    get:
      operationId: getService
      tags: [services]
      summary: Get service by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found

  /industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: List all industries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Industry"

  /stats:
    get:
      operationId: getStats
      tags: [services]
      summary: Company stats and highlights
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyStats"

  /quote-requests:
    post:
      operationId: submitQuoteRequest
      tags: [quotes]
      summary: Submit a quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "400":
          description: Validation error

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriber"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: No content

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      tags: [portal]
      summary: Get portal dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
        "401":
          description: Unauthorized

  /portal/projects:
    get:
      operationId: listPortalProjects
      tags: [portal]
      summary: List my projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized

  /portal/projects/{id}:
    get:
      operationId: getPortalProject
      tags: [portal]
      summary: Get project detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /portal/projects/{id}/messages:
    post:
      operationId: createPortalProjectMessage
      tags: [portal]
      summary: Post a message on my project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /portal/tickets:
    get:
      operationId: listPortalTickets
      tags: [portal]
      summary: List my tickets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized
    post:
      operationId: createPortalTicket
      tags: [portal]
      summary: Create a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized

  /portal/tickets/{id}:
    get:
      operationId: getPortalTicket
      tags: [portal]
      summary: Get ticket with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /portal/tickets/{id}/messages:
    post:
      operationId: addTicketMessage
      tags: [portal]
      summary: Add message to ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"
        "401":
          description: Unauthorized

  /portal/invoices:
    get:
      operationId: listPortalInvoices
      tags: [portal]
      summary: List my invoices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          description: Unauthorized

  /portal/account:
    get:
      operationId: getPortalAccount
      tags: [portal]
      summary: Get my account details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
        "401":
          description: Unauthorized
    patch:
      operationId: updatePortalAccount
      tags: [portal]
      summary: Update my account details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAccountUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAccount"
        "401":
          description: Unauthorized

  /admin/quote-requests:
    get:
      operationId: listAdminQuoteRequests
      tags: [admin]
      summary: List all quote requests (staff only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteRequest"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/quote-requests/{id}:
    patch:
      operationId: updateAdminQuoteRequest
      tags: [admin]
      summary: Update quote request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: List all customers (staff only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          description: Unauthorized
    post:
      operationId: createAdminCustomer
      tags: [admin]
      summary: Create a customer portal account (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Missing or invalid fields
        "401":
          description: Unauthorized
        "409":
          description: A customer with that email already exists

  /admin/projects:
    get:
      operationId: listAdminProjects
      tags: [admin]
      summary: List all projects (staff only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
    post:
      operationId: createAdminProject
      tags: [admin]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized

  /admin/projects/{id}:
    patch:
      operationId: updateAdminProject
      tags: [admin]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAdminProject
      tags: [admin]
      summary: Delete a project, detaching its tickets and invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeleteResult"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/projects/{id}/messages:
    post:
      operationId: createAdminProjectMessage
      tags: [admin]
      summary: Post a message on a project as staff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/tickets/{id}:
    get:
      operationId: getAdminTicket
      tags: [admin]
      summary: Get a ticket with its message thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateAdminTicket
      tags: [admin]
      summary: Update a ticket's status or priority
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAdminTicket
      tags: [admin]
      summary: Delete a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/tickets/{id}/messages:
    post:
      operationId: createAdminTicketMessage
      tags: [admin]
      summary: Reply to a ticket as staff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/services/{id}:
    patch:
      operationId: updateAdminService
      tags: [admin]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/tickets:
    get:
      operationId: listAdminTickets
      tags: [admin]
      summary: List all tickets (staff only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          description: Unauthorized

  /admin/quote-requests/{id}/convert:
    post:
      operationId: convertAdminQuoteRequest
      tags: [admin]
      summary: Turn a quote request into a customer and project in one step
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Already converted; returns the existing links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteConversionResult"
        "201":
          description: Converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteConversionResult"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/customers/{id}:
    get:
      operationId: getAdminCustomer
      tags: [admin]
      summary: Get a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateAdminCustomer
      tags: [admin]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Email already in use
    delete:
      operationId: deleteAdminCustomer
      tags: [admin]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Customer still has projects, tickets or invoices

  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [admin]
      summary: List all invoices (staff only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          description: Unauthorized
    post:
      operationId: createAdminInvoice
      tags: [admin]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "409":
          description: Invoice number already exists

  /admin/invoices/{id}:
    patch:
      operationId: updateAdminInvoice
      tags: [admin]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAdminInvoice
      tags: [admin]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Paid invoices cannot be deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Service:
      type: object
      required: [id, slug, title, summary, includes, icon, order]
      properties:
        id:
          type: number
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        body:
          type: ["string", "null"]
        includes:
          type: array
          items:
            type: string
        icon:
          type: string
        imageUrl:
          type: ["string", "null"]
        order:
          type: number

    ServiceUpdate:
      type: object
      properties:
        imageUrl:
          type: ["string", "null"]

    QuoteConversionResult:
      type: object
      required: [customerId, projectId, createdCustomer, alreadyConverted]
      properties:
        customerId:
          type: number
        projectId:
          type: number
        createdCustomer:
          type: boolean
          description: False when the quote's email already belonged to a customer.
        alreadyConverted:
          type: boolean
          description: True when this quote had been converted before.
        password:
          type: ["string", "null"]
          description: Generated password, returned once and only for a newly created customer.

    ProjectDeleteResult:
      type: object
      required: [detachedTickets, detachedInvoices]
      properties:
        detachedTickets:
          type: number
        detachedInvoices:
          type: number

    CustomerUpdate:
      type: object
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]
        password:
          type: string
          description: When present and non-empty, replaces the customer's password.

    InvoiceInput:
      type: object
      required: [number, customerId, amount, issueDate, dueDate]
      properties:
        number:
          type: string
        customerId:
          type: number
        projectId:
          type: ["number", "null"]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue]
        issueDate:
          type: string
        dueDate:
          type: string

    InvoiceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [draft, sent, paid, overdue]
        amount:
          type: number
        dueDate:
          type: string

    TicketUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, in-progress, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]

    Industry:
      type: object
      required: [id, slug, name, blurb, icon, order]
      properties:
        id:
          type: number
        slug:
          type: string
        name:
          type: string
        blurb:
          type: string
        icon:
          type: string
        order:
          type: number

    CompanyStats:
      type: object
      required: [projectsCompleted, clientsServed, yearsActive, industriesServed]
      properties:
        projectsCompleted:
          type: number
        clientsServed:
          type: number
        yearsActive:
          type: number
        industriesServed:
          type: number

    QuoteRequestInput:
      type: object
      required: [name, company, email, phone, message]
      properties:
        name:
          type: string
          minLength: 1
        company:
          type: string
          minLength: 1
        email:
          type: string
          
        phone:
          type: string
        serviceInterest:
          type: array
          items:
            type: string
        industry:
          type: ["string", "null"]
        message:
          type: string
          minLength: 1
        honeypot:
          type: ["string", "null"]

    QuoteRequest:
      type: object
      required: [id, name, company, email, phone, message, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        company:
          type: string
        email:
          type: string
        phone:
          type: string
        serviceInterest:
          type: array
          items:
            type: string
        industry:
          type: ["string", "null"]
        message:
          type: string
        status:
          type: string
          enum: [new, contacted, quoted, won, lost]
        customerId:
          type: ["number", "null"]
        projectId:
          type: ["number", "null"]
        createdAt:
          type: string

    QuoteRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, quoted, won, lost]

    NewsletterSubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        honeypot:
          type: ["string", "null"]

    NewsletterSubscriber:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string

    LoginInput:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          
        password:
          type: string
        role:
          type: string
          enum: [customer, staff]

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
        companyName:
          type: ["string", "null"]

    PortalDashboard:
      type: object
      required: [activeProjects, openTickets, unpaidInvoices, recentActivity]
      properties:
        activeProjects:
          type: number
        openTickets:
          type: number
        unpaidInvoices:
          type: number
        totalInvoiceAmount:
          type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: number
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string

    Milestone:
      type: object
      required: [label, done]
      properties:
        label:
          type: string
        dueDate:
          type: ["string", "null"]
        done:
          type: boolean

    Project:
      type: object
      required: [id, title, description, status, customerId, milestones, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [scoping, in-progress, on-hold, completed]
        customerId:
          type: number
        customerName:
          type: ["string", "null"]
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"
        startDate:
          type: ["string", "null"]
        targetDate:
          type: ["string", "null"]
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [title, description, customerId]
      properties:
        title:
          type: string
        description:
          type: string
        customerId:
          type: number
        status:
          type: string
          enum: [scoping, in-progress, on-hold, completed]
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        startDate:
          type: ["string", "null"]
        targetDate:
          type: ["string", "null"]

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [scoping, in-progress, on-hold, completed]
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        targetDate:
          type: ["string", "null"]

    TicketMessage:
      type: object
      required: [id, author, body, isStaff, createdAt]
      properties:
        id:
          type: number
        author:
          type: string
        body:
          type: string
        isStaff:
          type: boolean
        createdAt:
          type: string

    Ticket:
      type: object
      required: [id, subject, type, priority, status, customerId, messages, createdAt]
      properties:
        id:
          type: number
        subject:
          type: string
        type:
          type: string
          enum: [support, change-request]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [open, in-progress, resolved, closed]
        customerId:
          type: number
        customerName:
          type: ["string", "null"]
        projectId:
          type: ["number", "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"
        createdAt:
          type: string

    TicketInput:
      type: object
      required: [subject, type, priority, body]
      properties:
        subject:
          type: string
          minLength: 1
        type:
          type: string
          enum: [support, change-request]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        projectId:
          type: ["number", "null"]
        body:
          type: string
          minLength: 1

    TicketMessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    Invoice:
      type: object
      required: [id, number, customerId, amount, currency, status, issueDate, dueDate, createdAt]
      properties:
        id:
          type: number
        number:
          type: string
        customerId:
          type: number
        customerName:
          type: ["string", "null"]
        projectId:
          type: ["number", "null"]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue]
        issueDate:
          type: string
        dueDate:
          type: string
        createdAt:
          type: string

    Customer:
      type: object
      required: [id, companyName, contactName, email, phone, status, createdAt]
      properties:
        id:
          type: number
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [companyName, contactName, email, password]
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]

    CustomerAccount:
      type: object
      required: [id, companyName, contactName, email, phone]
      properties:
        id:
          type: number
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string

    CustomerAccountUpdate:
      type: object
      properties:
        contactName:
          type: string
        phone:
          type: string
        companyName:
          type: string
